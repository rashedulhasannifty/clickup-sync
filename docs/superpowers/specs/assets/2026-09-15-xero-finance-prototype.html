<title>Clicksy Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --font-sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --page-bg:#f7f7f5;--surface:#fff;--surface-alt:#fafaf9;--muted-bg:#f5f5f4;
  --hover:rgba(15,23,42,.04);--sidebar-bg:#fafaf8;--sidebar-active-bg:rgba(123,104,238,.10);
  --border:#e7e5e2;--border-soft:#efeeec;--border-strong:#d4d4d2;
  --text:#0f172a;--text-muted:#64748b;--text-faint:#94a3b8;
  --accent:#7B68EE;--accent-hover:#6953dc;--accent-soft:rgba(123,104,238,.10);
  --accent-grad:linear-gradient(120deg,#FF02F0 0%,#7B68EE 50%,#49CCF9 100%);
  --green:#10b981;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;
  --xero:#13B5EA;--xero-soft:rgba(19,181,234,.12);
  --pill-gray-bg:#f1f5f9;--pill-gray-text:#475569;--pill-green-bg:#d1fae5;--pill-green-text:#065f46;
  --pill-amber-bg:#fef3c7;--pill-amber-text:#92400e;--pill-red-bg:#fee2e2;--pill-red-text:#991b1b;
  --pill-blue-bg:#dbeafe;--pill-blue-text:#1e40af;--pill-purple-bg:#ede9fe;--pill-purple-text:#5b21b6;
  --card-shadow:0 3px 0 0 var(--border-strong),0 9px 20px rgba(15,23,42,.13);
  --row-shadow:0 5px 16px rgba(15,23,42,.22),0 2px 0 0 var(--border-strong);
  --inset:inset 0 2px 4px rgba(15,23,42,.16),inset 0 1px 1px rgba(15,23,42,.10);
  --btn-edge:#00030a;--btn-face:#0f172a;--btn-face-text:#fff;
  --overlay:rgba(15,23,42,.32);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --page-bg:#0a0a0b;--surface:#131316;--surface-alt:#18181b;--muted-bg:#1c1c20;
  --hover:rgba(255,255,255,.04);--sidebar-bg:#0f0f11;--sidebar-active-bg:rgba(123,104,238,.15);
  --border:#27272a;--border-soft:#1f1f22;--border-strong:#3f3f46;
  --text:#fafafa;--text-muted:#a1a1aa;--text-faint:#71717a;
  --xero-soft:rgba(19,181,234,.16);
  --pill-gray-bg:rgba(148,163,184,.12);--pill-gray-text:#cbd5e1;--pill-green-bg:rgba(16,185,129,.15);--pill-green-text:#34d399;
  --pill-amber-bg:rgba(245,158,11,.15);--pill-amber-text:#fbbf24;--pill-red-bg:rgba(239,68,68,.15);--pill-red-text:#f87171;
  --pill-blue-bg:rgba(59,130,246,.15);--pill-blue-text:#60a5fa;--pill-purple-bg:rgba(139,92,246,.18);--pill-purple-text:#c4b5fd;
  --card-shadow:0 3px 0 0 #000,0 9px 22px rgba(0,0,0,.6);
  --row-shadow:0 6px 18px rgba(0,0,0,.65),0 2px 0 0 #000;
  --inset:inset 0 2px 4px rgba(0,0,0,.55),inset 0 1px 1px rgba(0,0,0,.4);
  --btn-edge:#b8b8bd;--btn-face:#fafafa;--btn-face-text:#0a0a0b;
  --overlay:rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page-bg:#0a0a0b;--surface:#131316;--surface-alt:#18181b;--muted-bg:#1c1c20;
  --hover:rgba(255,255,255,.04);--sidebar-bg:#0f0f11;--sidebar-active-bg:rgba(123,104,238,.15);
  --border:#27272a;--border-soft:#1f1f22;--border-strong:#3f3f46;
  --text:#fafafa;--text-muted:#a1a1aa;--text-faint:#71717a;
  --xero-soft:rgba(19,181,234,.16);
  --pill-gray-bg:rgba(148,163,184,.12);--pill-gray-text:#cbd5e1;--pill-green-bg:rgba(16,185,129,.15);--pill-green-text:#34d399;
  --pill-amber-bg:rgba(245,158,11,.15);--pill-amber-text:#fbbf24;--pill-red-bg:rgba(239,68,68,.15);--pill-red-text:#f87171;
  --pill-blue-bg:rgba(59,130,246,.15);--pill-blue-text:#60a5fa;--pill-purple-bg:rgba(139,92,246,.18);--pill-purple-text:#c4b5fd;
  --card-shadow:0 3px 0 0 #000,0 9px 22px rgba(0,0,0,.6);
  --row-shadow:0 6px 18px rgba(0,0,0,.65),0 2px 0 0 #000;
  --inset:inset 0 2px 4px rgba(0,0,0,.55),inset 0 1px 1px rgba(0,0,0,.4);
  --btn-edge:#b8b8bd;--btn-face:#fafafa;--btn-face-text:#0a0a0b;
  --overlay:rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:var(--page-bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.mono{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:flex;min-height:100vh}
.side{width:232px;flex-shrink:0;border-right:1px solid var(--border);background:var(--sidebar-bg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{height:56px;padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--accent-grad)}
.logo b{font-size:17px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.1}
.logo small{font-size:10px;color:var(--text-muted);font-weight:500}
.nav{flex:1;padding:8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-h{font-size:10px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;font-size:13px;font-weight:500;color:var(--text-muted);border-radius:7px;position:relative;text-decoration:none;transition:transform .1s,background .1s}
.nav a:hover{transform:translateY(-1px);background:var(--hover)}
.nav a[aria-current="page"]{color:var(--text);background:var(--sidebar-active-bg);box-shadow:0 1px 2px rgba(15,23,42,.06),0 3px 9px rgba(123,104,238,.2)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:2px;border-radius:9px;background:var(--accent)}
.nav a.dim{opacity:.55;cursor:default}
.nav a.dim:hover{transform:none;background:none}
.nav a span:not(.tag){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10px;font-weight:600;padding:2px 6px;border-radius:999px;background:var(--pill-purple-bg);color:var(--pill-purple-text)}
.side-foot{padding:10px;border-top:1px solid var(--border)}
.org{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:var(--muted-bg)}
.org i{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#1f2937,#4b5563);color:#fff;font:700 11px var(--font-sans);display:flex;align-items:center;justify-content:center;font-style:normal}
.org b{font-size:12px;display:block}.org small{font-size:10px;color:var(--text-muted)}
.main{flex:1;min-width:0;padding-block:24px 64px;padding-inline:clamp(16px,3vw,32px)}
.wrap{max-width:1280px;margin:0 auto}
.topbar{display:none}

/* prototype strip */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 12px;margin-bottom:20px;border:1px dashed var(--border-strong);border-radius:10px;background:var(--surface-alt);font-size:12px;color:var(--text-muted)}
.proto b{color:var(--text);font-weight:600}
.proto label{display:inline-flex;align-items:center;gap:6px}
.proto select{font:inherit;font-size:12px;padding:3px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text)}

/* header */
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;row-gap:12px;margin-bottom:20px}
.ph h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph p{font-size:13px;color:var(--text-muted);margin:4px 0 0;max-width:720px}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.synced{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);padding:0 4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--pill-green-bg)}
.dot.red{background:var(--red);box-shadow:0 0 0 3px var(--pill-red-bg)}
.dot.amber{background:var(--amber);box-shadow:0 0 0 3px var(--pill-amber-bg)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:500;color:var(--text);box-shadow:0 2px 0 0 var(--border-strong);transition:transform 90ms,box-shadow 90ms,background .1s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 0 0 var(--border-strong),0 6px 12px rgba(15,23,42,.08)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 0 var(--border-strong)}
.btn.primary{background:var(--btn-face);color:var(--btn-face-text);border-color:transparent;box-shadow:0 3px 0 0 var(--btn-edge)}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 3px 0 0 #4b3bb0}
.btn.xero{background:var(--xero);color:#fff;border-color:transparent;box-shadow:0 3px 0 0 #0b7fa6;height:38px;padding:0 16px;font-size:14px}
.btn.danger{background:var(--pill-red-bg);color:var(--pill-red-text);border-color:transparent;box-shadow:0 2px 0 0 rgba(153,27,27,.35)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-muted)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.6;pointer-events:none}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--card-shadow)}
.card-pad{padding:16px 18px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--border-soft)}
.card-h h3{font-size:14px;font-weight:600;letter-spacing:-.01em;margin:0}
.card-h p{font-size:12px;color:var(--text-muted);margin:3px 0 0}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;width:100%}
.kpi.clickable{cursor:pointer;transition:transform 140ms,box-shadow 140ms}
.kpi.clickable:hover{transform:translateY(-3px)}
.kpi-l{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;gap:8px}
.kpi-v{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-c{font-size:12px;color:var(--text-muted)}
.kpi-c b{font-weight:600}
.up{color:var(--green)}.down{color:var(--red)}

/* insight row */
.insights{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-bottom:20px}
.aged-bar{display:flex;height:14px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 12px}
.aged-bar span{display:block;height:100%}
.aged-legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.aged-legend div{font-size:11px;color:var(--text-muted);display:flex;flex-direction:column;gap:2px}
.aged-legend b{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
.aged-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.flow svg{width:100%;height:auto;display:block}
.flow-leg{display:flex;gap:14px;font-size:11px;color:var(--text-muted)}
.flow-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* tabs */
.utabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.utabs button{padding:8px 14px;font-size:13px;font-weight:500;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--text-muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.utabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.utabs button:hover{color:var(--text)}
.cnt{font-size:10px;font-weight:700;padding:1px 5px;border-radius:999px;background:var(--muted-bg);color:var(--text-muted);font-variant-numeric:tabular-nums}
[aria-selected="true"] .cnt{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;background:var(--muted-bg);border-radius:8px;padding:3px;box-shadow:inset 0 1px 3px rgba(15,23,42,.13)}
.seg button{padding:4px 11px;font-size:12px;font-weight:500;border-radius:6px;border:0;background:transparent;color:var(--text-muted);transition:transform 90ms}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);transform:translateY(-1px);box-shadow:0 2px 0 0 var(--border-strong),0 4px 8px rgba(15,23,42,.14)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.search{position:relative;flex:1 1 240px;max-width:340px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-faint)}
.search input,.sel{width:100%;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;font-size:13px;box-shadow:var(--inset)}
.search input{padding:0 10px 0 32px}
.sel{width:auto;padding:0 8px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);user-select:none}
.chk input{accent-color:var(--accent)}
.grow{flex:1}

/* table */
.tcard{overflow:hidden}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--surface-alt);text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th .arr{font-size:10px;margin-left:3px;color:var(--accent)}
td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
tbody tr{transition:box-shadow .12s,background .12s;cursor:pointer}
tbody tr:hover{position:relative;z-index:1;box-shadow:var(--row-shadow);background:var(--surface)}
tbody tr:nth-child(even){background:rgba(127,127,127,.025)}
tfoot td{background:var(--surface-alt);font-weight:600;border-bottom:0;border-top:1px solid var(--border)}
.t-sub{font-size:12px;color:var(--text-muted)}
.muted{color:var(--text-muted)}.faint{color:var(--text-faint)}
.strike{text-decoration:line-through;color:var(--text-faint)}
.who{display:flex;align-items:center;gap:10px;min-width:200px}
.av{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:.02em}
.who b{font-weight:600;display:block}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap;line-height:1.3}
.pill.xs{padding:2px 6px;font-size:10px}
.p-gray{background:var(--pill-gray-bg);color:var(--pill-gray-text)}.p-green{background:var(--pill-green-bg);color:var(--pill-green-text)}
.p-amber{background:var(--pill-amber-bg);color:var(--pill-amber-text)}.p-red{background:var(--pill-red-bg);color:var(--pill-red-text)}
.p-blue{background:var(--pill-blue-bg);color:var(--pill-blue-text)}.p-purple{background:var(--pill-purple-bg);color:var(--pill-purple-text)}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.cur{font-size:10px;font-weight:600;color:var(--text-faint);margin-left:4px;font-family:var(--font-mono)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;font-size:12px;color:var(--text-muted);border-top:1px solid var(--border-soft);flex-wrap:wrap}
.pager .pg{display:flex;gap:4px}

/* drawer */
.overlay{position:fixed;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(600px,100vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .22s cubic-bezier(.16,1,.3,1);z-index:50;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dr-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);min-height:52px}
.dr-h .crumb{flex:1;font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;min-width:0}
.dr-b{flex:1;overflow-y:auto;padding:20px}
.dr-title{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.dr-title .av{width:44px;height:44px;border-radius:10px;font-size:15px}
.dr-title h2{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;padding:14px 0;border-block:1px solid var(--border-soft);margin-bottom:16px}
.facts div{display:flex;flex-direction:column;gap:2px;min-width:0}
.facts dt{font-size:11px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em}
.facts dd{margin:0;font-size:13px;overflow-wrap:anywhere}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:18px}
.mini div{background:var(--surface-alt);border:1px solid var(--border-soft);border-radius:8px;padding:9px 10px}
.mini small{display:block;font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.mini b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.doc-list{display:flex;flex-direction:column}
.doc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 8px;border-bottom:1px solid var(--border-soft);cursor:pointer;border-radius:6px;background:none;border-inline:0;border-top:0;text-align:left;font:inherit;width:100%}
.doc:hover{background:var(--hover)}
.doc .r1{font-weight:600;display:flex;gap:8px;align-items:center;min-width:0}
.doc .r2{font-size:12px;color:var(--text-muted)}
.doc .amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--border-soft);display:flex;flex-direction:column;gap:14px}
.timeline li{position:relative;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline small{display:block;color:var(--text-muted);font-size:12px}
.lines{width:100%;font-size:12.5px;margin-bottom:16px}
.lines th{position:static;background:none;padding:6px 8px;font-size:10px}
.lines td{padding:8px;cursor:default}
.lines tbody tr{cursor:default}.lines tbody tr:hover{box-shadow:none}
.totals{margin-left:auto;width:min(280px,100%);display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:13px;margin-bottom:18px}
.totals .grand{font-size:15px;font-weight:700;border-top:1px solid var(--border);padding-top:8px}
.section-l{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.att{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border-soft);border-radius:8px;font-size:13px;margin-bottom:6px}
.att .grow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-f{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* settings */
.set-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.hero-x{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
.xmark{width:52px;height:52px;border-radius:50%;background:var(--xero);color:#fff;display:flex;align-items:center;justify-content:center;font:600 26px/1 var(--font-sans);letter-spacing:-.04em}
.xmark.sm{width:34px;height:34px;font-size:17px}
.hero-x h2{font-size:18px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.hero-x p{margin:0 0 14px;color:var(--text-muted);max-width:60ch}
.reads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0 18px}
.reads div{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border-soft)}
.reads svg{color:var(--xero);margin-top:1px}
.reads small{display:block;color:var(--text-muted);font-size:12px}
.scopes{display:flex;flex-wrap:wrap;gap:6px}
.scopes code{font-family:var(--font-mono);font-size:11px;padding:3px 7px;border-radius:6px;background:var(--muted-bg);color:var(--text-muted);border:1px solid var(--border-soft)}
.note{font-size:12px;color:var(--text-muted);display:flex;gap:8px;align-items:flex-start;margin-top:14px}
.callout{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}
.callout b{display:block;margin-bottom:2px}
.callout.red{background:var(--pill-red-bg);color:var(--pill-red-text)}
.callout.amber{background:var(--pill-amber-bg);color:var(--pill-amber-text)}
.callout.blue{background:var(--pill-blue-bg);color:var(--pill-blue-text)}
.callout .grow{min-width:0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:13px}
.kv dt{color:var(--text-muted)}.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.srow{display:grid;grid-template-columns:minmax(0,1.3fr) 90px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
.srow:last-child{border-bottom:0}
.srow.head{font-size:11px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;padding-top:0}
.prog{height:6px;border-radius:9px;background:var(--muted-bg);overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s}
.stabs{margin-bottom:18px}

/* empty / skeleton */
.empty{text-align:center;padding:56px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{margin:6px 0 0;font-size:16px;font-weight:600}
.empty p{margin:0 0 8px;color:var(--text-muted);max-width:46ch}
.sk{height:12px;border-radius:5px;background:linear-gradient(90deg,var(--muted-bg) 25%,var(--border-soft) 50%,var(--muted-bg) 75%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* modal */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.open{display:flex}
.modal .card{width:min(440px,100%);padding:20px}
.modal h3{margin:0 0 8px;font-size:16px}
.modal p{margin:0 0 16px;color:var(--text-muted);font-size:13px}
.toast{position:fixed;right:16px;bottom:16px;z-index:70;background:var(--btn-face);color:var(--btn-face-text);padding:10px 14px;border-radius:10px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(20px);opacity:0;transition:.2s;pointer-events:none}
.toast.show{transform:none;opacity:1}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.insights{grid-template-columns:1fr}.set-grid{grid-template-columns:1fr}}

  .reads{grid-template-columns:1fr}.hero-x{grid-template-columns:1fr}
  .mini{grid-template-columns:repeat(2,minmax(0,1fr))}
  .srow{grid-template-columns:minmax(0,1fr) auto}.srow .hide-m{display:none}
  .app{flex-direction:column}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function docStatus(d) {
  if (d.status === 'DRAFT') return pill('Draft', 'gray');
  if (d.status === 'SUBMITTED') return pill('Awaiting approval', 'blue');
  if (d.status === 'VOIDED') return pill('Voided', 'gray');
  if (d.status === 'PAID') return pill('Paid', 'green');
  if (d.overdue) return pill('Overdue · ' + daysBetween(TODAY, d.dueDate) + 'd', 'red');
  if (d.paid > 0) return pill('Part paid', 'amber');
  return pill('Awaiting payment', 'amber');
}

/* ── Finance page ─────────────────────────────────────────────────────────── */
function kpis() {
  const open = invoices.filter(d => d.due > 0), od = open.filter(d => d.overdue);
  const openB = bills.filter(d => d.due > 0);
  const oldest = od.length ? Math.max(...od.map(d => daysBetween(TODAY, d.dueDate))) : 0;
  const nextDue = openB.map(d => d.dueDate).filter(d => d >= addDays(TODAY, -1)).sort((a, b) => a - b)[0];
  const monthStart = new Date(Date.UTC(2026, 8, 1));
  const inMonth = d => d.date >= monthStart;
  const out = payments.filter(p => p.kind === 'Paid' && inMonth(p)).reduce((s, p) => s + p.base, 0) + bank.filter(t => t.type === 'SPEND' && inMonth(t)).reduce((s, t) => s + t.base, 0);
  const inn = payments.filter(p => p.kind === 'Received' && inMonth(p)).reduce((s, p) => s + p.base, 0) + bank.filter(t => t.type === 'RECEIVE' && inMonth(t)).reduce((s, t) => s + t.base, 0);
  const sum = a => a.reduce((s, d) => s + d.due * d.rate, 0);
  const card = (l, v, c, act, tone) => `<button class="card kpi clickable" data-kpi="${act}"><span class="kpi-l">${l}</span><span class="kpi-v"${tone ? ` style="color:var(--${tone})"` : ''}>${v}</span><span class="kpi-c">${c}</span></button>`;
  return `<div class="kpis">
    ${card('Owed to you', base(sum(open)), `${open.length} unpaid invoices`, 'recv')}
    ${card('Overdue', base(sum(od)), `${od.length} invoices · oldest <b>${oldest}d</b>`, 'overdue', 'red')}
    ${card('You owe', base(sum(openB)), `${openB.length} bills · next due ${nextDue ? dShort(nextDue) : '—'}`, 'pay')}
    ${card('Money in · Sep', base(inn), `<span class="up">Payments + receive money</span>`, 'in')}
    ${card('Money out · Sep', base(out), `Bills paid + spend money`, 'out')}
  </div>`;
}

function insights() {
  const open = invoices.filter(d => d.due > 0);
  const buckets = [['Current', 0, 0, '#10b981'], ['1–30 days', 1, 30, '#f59e0b'], ['31–60 days', 31, 60, '#f97316'], ['61–90 days', 61, 90, '#ef4444'], ['90+ days', 91, 9999, '#b91c1c']].map(([l, a, b, c]) => {
    const v = open.filter(d => { const o = Math.max(0, daysBetween(TODAY, d.dueDate)); return o >= a && o <= b; }).reduce((s, d) => s + d.due * d.rate, 0);
    return { l, v, c };
  });
  const tot = buckets.reduce((s, b) => s + b.v, 0) || 1;
  // money in vs out, last 6 months
  const months = Array.from({ length: 6 }, (_, i) => new Date(Date.UTC(2026, 3 + i, 1)));
  const inM = (d, m) => d.getUTCFullYear() === m.getUTCFullYear() && d.getUTCMonth() === m.getUTCMonth();
  const flows = months.map(m => ({
    m, in: payments.filter(p => p.kind === 'Received' && inM(p.date, m)).reduce((s, p) => s + p.base, 0) + bank.filter(t => t.type === 'RECEIVE' && inM(t.date, m)).reduce((s, t) => s + t.base, 0),
    out: payments.filter(p => p.kind === 'Paid' && inM(p.date, m)).reduce((s, p) => s + p.base, 0) + bank.filter(t => t.type === 'SPEND' && inM(t.date, m)).reduce((s, t) => s + t.base, 0),
  }));
  const max = Math.max(...flows.flatMap(f => [f.in, f.out]));
  const step = max > 20000 ? 10000 : 5000, top = Math.ceil(max / step) * step;
  const W = 340, H = 150, L = 34, B = 20, cw = (W - L) / 6, bw = 12;
  const y = v => H - B - (v / top) * (H - B - 8);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money in versus money out, April to September 2026">`;
  for (let v = 0; v <= top; v += step) svg += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border-soft)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end" font-size="9" fill="var(--text-faint)">${v ? v / 1000 + 'k' : '0'}</text>`;
  flows.forEach((f, i) => {
    const cx = L + cw * i + cw / 2;
    svg += `<rect x="${cx - bw - 1}" y="${y(f.in)}" width="${bw}" height="${H - B - y(f.in)}" rx="2" fill="var(--green)"><title>${f.m.toLocaleString('en-GB', { month: 'long', timeZone: 'UTC' })} in: ${base(f.in)}</title></rect>`;
    svg += `<rect x="${cx + 1}" y="${y(f.out)}" width="${bw}" height="${H - B - y(f.out)}" rx="2" fill="var(--accent)"><title>${f.m.toLocaleString('en-GB', { month: 'long', timeZone: 'UTC' })} out: ${base(f.out)}</title></rect>`;
    svg += `<text x="${cx}" y="${H - 5}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${f.m.toLocaleString('en-GB', { month: 'short', timeZone: 'UTC' })}</text>`;
  });
  svg += '</svg>';
  return `<div class="insights">
    <section class="card card-pad"><div class="card-h"><div><h3>Aged receivables</h3><p>Unpaid customer invoices by days past due, in USD</p></div><button class="btn sm ghost" data-kpi="overdue">View overdue ${ic('ext', 13)}</button></div>
      <div class="aged-bar" role="img" aria-label="Aged receivables">${buckets.map(b => b.v ? `<span style="width:${(b.v / tot) * 100}%;background:${b.c}" title="${b.l}: ${base(b.v)}"></span>` : '').join('')}</div>
      <div class="aged-legend">${buckets.map(b => `<div><span><i style="background:${b.c}"></i>${b.l}</span><b>${base(b.v)}</b></div>`).join('')}</div>
      <div class="section-l" style="margin-top:16px">Most overdue</div>
      <div class="doc-list">${contacts.filter(c => c.overdue).sort((a, b) => b.overdue - a.overdue).slice(0, 3).map(c => { const od = invoices.filter(d => d.contactId === c.id && d.overdue); return `<button class="doc" data-open="contact" data-id="${c.id}"><span class="r1">${avatar(c).replace('class="av"', 'class="av" style="width:20px;height:20px;font-size:8px;border-radius:5px;background:' + c.hue + '"')}${esc(c.name)}</span><span class="amt down">${base(c.overdue)}</span><span class="r2">${od.length} overdue ${od.length === 1 ? 'invoice' : 'invoices'} · oldest ${Math.max(...od.map(d => daysBetween(TODAY, d.dueDate)))} days late</span></button>`; }).join('')}</div>
    </section>
    <section class="card card-pad flow"><div class="card-h"><div><h3>Money in vs out</h3><p>Last 6 months, USD</p></div><div class="flow-leg"><span><i style="background:var(--green)"></i>In</span><span><i style="background:var(--accent)"></i>Out</span></div></div>${svg}</section>
  </div>`;
}

function financeHeader() {
  const syncLabel = S.syncing ? 'Syncing…' : S.xero === 'reconnect' ? 'Sync paused since 12 Sep' : 'Synced ' + Math.max(1, Math.round((TODAY - S.lastSync) / 6e4)) + ' min ago';
  const dot = S.xero === 'reconnect' ? 'red' : S.syncing ? 'amber' : '';
  const connected = S.xero === 'connected' || S.xero === 'reconnect';
  return `<div class="ph"><div><h1>Finance <span class="tag">Beta</span>${connected ? `<span class="pill p-gray" style="gap:6px"><span class="xmark sm" style="width:16px;height:16px;font-size:9px">x</span>Nifty IT Solution Ltd</span>` : ''}</h1>
    <p>Contacts, invoices, bills and bank transactions from Xero. Read-only — to change anything, edit it in Xero and it shows up here on the next sync.</p></div>
    ${connected ? `<div class="actions"><span class="synced"><span class="dot ${dot}"></span>${syncLabel}</span>
      <button class="btn" data-act="sync" ${S.syncing || S.xero === 'reconnect' ? 'disabled' : ''}>${ic('refresh')}${S.syncing ? 'Syncing' : 'Sync now'}</button>
      <button class="btn" data-act="export">${ic('download')}Export</button></div>` : ''}</div>`;
}

function renderFinance() {
  let h = protoStrip() + financeHeader();
  if (S.xero === 'none' || S.xero === 'error') {
    h += `<div class="card"><div class="empty"><span class="xmark">x</span><h3>Connect Xero to see your finances here</h3>
      <p>Once connected, every Xero contact appears here with its invoices, bills, spend money, credit notes and payments. It usually takes a few minutes for the first sync.</p>
      ${S.role === 'OWNER' ? `<button class="btn xero" data-nav="settings">${ic('link')}Go to Xero settings</button>` : `<span class="pill p-gray">${ic('lock', 12)} Only an Owner can connect Xero — ask an Owner in your organisation.</span>`}</div></div>`;
    return h;
  }
  if (S.xero === 'syncing') {
    h += `<div class="callout blue">${ic('info')}<div class="grow"><b>First sync in progress</b>We're copying your Xero data. You can leave this page — it keeps running in the background.</div></div>
      <div class="card card-pad" style="margin-bottom:16px">${syncRows(true)}</div>
      <div class="card tcard">${Array.from({ length: 7 }, () => `<div style="display:flex;gap:16px;padding:14px 16px;border-bottom:1px solid var(--border-soft)"><div class="sk" style="width:30%"></div><div class="sk" style="width:15%"></div><div class="sk" style="width:20%"></div><div class="sk" style="width:12%;margin-left:auto"></div></div>`).join('')}</div>`;
    return h;
  }
  if (S.xero === 'reconnect') h += `<div class="callout red">${ic('alert')}<div class="grow"><b>Xero disconnected on 12 Sep</b>Figures below are from before then and may be out of date. ${S.role === 'OWNER' ? 'Reconnect to resume syncing.' : 'Ask an Owner to reconnect Xero.'}</div>${S.role === 'OWNER' ? `<button class="btn sm" data-nav="settings">Reconnect</button>` : ''}</div>`;
  h += kpis() + insights();
  const tabs = [['contacts', 'Contacts', contacts.length], ['invoices', 'Invoices', invoices.length], ['bills', 'Bills', bills.length], ['bank', 'Bank transactions', bank.length], ['credits', 'Credit notes', credits.length], ['payments', 'Payments', payments.length]];
  h += `<div class="utabs" role="tablist" aria-label="Finance records">${tabs.map(([k, l, n]) => `<button role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}<span class="cnt">${n}</span></button>`).join('')}</div>`;
  h += toolbar() + table();
  return h;
}
IC.link = '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>';
S.range = 'all'; S.cur = 'all'; S.recon = 'all'; S.dtab = 'invoices';
const guid = id => { let h = 0; for (const ch of id + 'xero') h = (h * 31 + ch.charCodeAt(0)) >>> 0; const x = (h.toString(16) + 'a3f9c2e17b4d').padEnd(32, '0'); return `${x.slice(0, 8)}-${x.slice(8, 12)}-4${x.slice(13, 16)}-9${x.slice(17, 20)}-${x.slice(20, 32)}`; };
const sel = (id, key, opts) => `<select class="sel" id="${id}" data-f="${key}" aria-label="${id.replace('f-', '')}">${opts.map(([v, l]) => `<option value="${v}" ${S[key] === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
const seg = (key, opts) => `<div class="seg" role="tablist">${opts.map(([v, l]) => `<button role="tab" data-seg="${key}" data-v="${v}" aria-selected="${S[key] === v}">${l}</button>`).join('')}</div>`;

function toolbar() {
  const search = `<div class="search">${ic('search')}<input id="f-q" data-f="q" type="search" placeholder="${{ contacts: 'Search name, email or person', invoices: 'Search number, contact or reference', bills: 'Search bill, supplier or reference', bank: 'Search payee or description', credits: 'Search credit notes', payments: 'Search payments' }[S.tab]}" value="${esc(S.q)}"></div>`;
  const range = sel('f-range', 'range', [['all', 'Any date'], ['30', 'Last 30 days'], ['90', 'Last 90 days'], ['ytd', 'This year']]);
  let f = '';
  if (S.tab === 'contacts') f = seg('role_f', [['all', 'All'], ['cust', 'Customers'], ['supp', 'Suppliers']]) + `<label class="chk" for="f-arch"><input id="f-arch" type="checkbox" data-f="archived" ${S.archived ? 'checked' : ''}>Show archived</label>`;
  if (S.tab === 'invoices' || S.tab === 'bills') f = sel('f-status', 'status', [['all', 'All statuses'], ['DRAFT', 'Draft'], ['SUBMITTED', 'Awaiting approval'], ['AUTHORISED', 'Awaiting payment'], ['overdue', 'Overdue'], ['PAID', 'Paid'], ['VOIDED', 'Voided']]) + range + (S.tab === 'invoices' ? sel('f-cur', 'cur', [['all', 'All currencies'], ['USD', 'USD'], ['AUD', 'AUD'], ['GBP', 'GBP']]) : '');
  if (S.tab === 'bank') f = seg('btype', [['all', 'All'], ['SPEND', 'Spend money'], ['RECEIVE', 'Receive money']]) + range + sel('f-recon', 'recon', [['all', 'Any reconciliation'], ['yes', 'Reconciled'], ['no', 'Unreconciled']]);
  if (S.tab === 'credits' || S.tab === 'payments') f = range;
  return `<div class="toolbar">${search}${f}<span class="grow"></span><span class="t-sub">${rows().length} records</span></div>`;
}

function inRange(d) {

/* ── Settings → Xero ──────────────────────────────────────────────────────── */
S.progress = 0;
const ENTITIES = () => [['Contacts', contacts.length], ['Invoices', invoices.length], ['Bills', bills.length], ['Bank transactions', bank.length], ['Credit notes', credits.length], ['Payments', payments.length], ['Attachment list', invoices.concat(bills).filter(d => d.attachments.length).length]];
function syncRows(progress) {
  const ago = ['6 min ago', '6 min ago', '6 min ago', '7 min ago', '7 min ago', '7 min ago', '7 min ago'];
  return `<div class="srow head"><span>Data</span><span class="num">Records</span><span class="hide-m">${progress ? 'Progress' : 'Last change pulled'}</span><span>Status</span></div>` +
    ENTITIES().map(([l, n], i) => {
      const p = progress ? Math.max(0, Math.min(100, S.progress * 7 - i * 100)) : 100;
      const stat = progress ? (p >= 100 ? pill('Done', 'green', 1) : p > 0 ? pill('Syncing', 'blue', 1) : pill('Queued', 'gray', 1)) : S.xero === 'reconnect' ? pill('Paused', 'red', 1) : pill('Up to date', 'green', 1);
      return `<div class="srow"><span style="font-weight:500">${l}</span><span class="num">${progress ? Math.round(n * p / 100) : n}</span><span class="hide-m">${progress ? `<div class="prog"><span style="width:${p}%"></span></div>` : `<span class="muted">${S.xero === 'reconnect' ? '12 Sep, 23:40' : ago[i]}</span>`}</span><span>${stat}</span></div>`;
    }).join('');
}
const SCOPES = ['accounting.contacts.read', 'accounting.invoices.read', 'accounting.payments.read', 'accounting.banktransactions.read', 'accounting.attachments.read', 'accounting.settings.read', 'offline_access'];
function renderSettings() {
  const owner = S.role === 'OWNER';
  let h = protoStrip() + `<div class="ph"><div><h1>Settings</h1><p>Workspace connections, sync behaviour and notifications.</p></div></div>
    <div class="seg stabs" role="tablist" aria-label="Settings sections">${['Connection', 'Sync', 'Scopes', 'Notifications'].map(t => `<button role="tab" aria-selected="false" data-act="toast" data-msg="${t} is an existing tab — unchanged by this feature">${t}</button>`).join('')}<button role="tab" aria-selected="true">Xero</button></div>`;
  if (!owner) h += `<div class="callout amber">${ic('lock')}<div class="grow"><b>View only</b>Only an Owner can connect or disconnect Xero. You can still see sync status and use the Finance page.</div></div>`;
  if (S.xero === 'error') h += `<div class="callout red">${ic('alert')}<div class="grow"><b>Xero didn't finish connecting</b>The Xero consent screen was cancelled, so nothing was saved. Select Connect to Xero to try again.</div></div>`;
  if (S.xero === 'none' || S.xero === 'error') {
    h += `<section class="card card-pad"><div class="hero-x"><span class="xmark">x</span><div>
      <h2>Connect your Xero organisation</h2>
      <p>Bring every client's invoices, supplier bills and bank spending into Clicksy. We copy the data on a schedule so Finance pages load instantly and Grafana can report on it.</p>
      <div class="reads">
        <div>${ic('users')}<span>Contacts<small>Customers and suppliers, with balances</small></span></div>
        <div>${ic('file')}<span>Invoices, bills & credit notes<small>Including line items and tax</small></span></div>
        <div>${ic('wallet')}<span>Spend & receive money<small>Bank transactions and reconciliation state</small></span></div>
        <div>${ic('clip')}<span>Payments & attachment names<small>Files stay in Xero — we only link to them</small></span></div>
      </div>
      <div class="actions"><button class="btn xero" data-act="connect" ${owner ? '' : 'disabled'}>${ic('link')}Connect to Xero</button><span class="t-sub">You'll sign in on Xero and choose the organisation.</span></div>
      <div class="note">${ic('shield', 14)}<span><b style="color:var(--text)">Read-only.</b> Clicksy can't create, edit or delete anything in Xero. Your Xero sign-in is stored encrypted and never shown again.</span></div>
      <div class="section-l">Permissions requested</div><div class="scopes">${SCOPES.map(s => `<code>${s}</code>`).join('')}</div>
    </div></div></section>`;
    return h;
  }
  const statusPill = S.xero === 'reconnect' ? pill('Needs reconnect', 'red') : S.xero === 'syncing' ? pill('First sync running', 'blue') : pill('Connected', 'green');
  if (S.xero === 'reconnect') h += `<div class="callout red">${ic('alert')}<div class="grow"><b>Xero stopped accepting our connection on 12 Sep</b>This happens if someone removed the app in Xero, or the sign-in wasn't used for 60 days. Synced data is kept. Reconnect with the same organisation to carry on where it left off.</div>${owner ? `<button class="btn sm" data-act="connect">Reconnect</button>` : ''}</div>`;
  h += `<div class="set-grid"><div style="display:flex;flex-direction:column;gap:16px">
    <section class="card card-pad"><div class="card-h"><div style="display:flex;gap:12px;align-items:center"><span class="xmark sm">x</span><div><h3>Nifty IT Solution Ltd</h3><p>Xero organisation · connected 15 Aug 2026 by Rashedul Hasan</p></div></div>${statusPill}</div>
      <dl class="kv"><dt>Base currency</dt><dd>USD — US Dollar</dd><dt>Tenant ID</dt><dd class="mono" style="font-size:12px">${guid('tenant')}</dd><dt>Access</dt><dd>Read-only · ${SCOPES.length} permissions</dd><dt>Callback URL</dt><dd class="mono" style="font-size:12px">https://log.niftyitsolution.com/api/xero/callback</dd></dl></section>
    <section class="card card-pad"><div class="card-h"><div><h3>Data sync</h3><p>${S.xero === 'syncing' ? 'Copying everything from Xero for the first time.' : 'Changes are pulled every hour. Unpaid invoices and balances are re-checked nightly at 02:00 (Dhaka).'}</p></div>
      <button class="btn sm" data-act="sync" ${S.xero !== 'connected' || S.syncing ? 'disabled' : ''}>${ic('refresh', 14)}${S.syncing ? 'Syncing…' : 'Sync now'}</button></div>${syncRows(S.xero === 'syncing')}</section>
  </div><div style="display:flex;flex-direction:column;gap:16px">
    <section class="card card-pad"><div class="card-h"><div><h3>Connection health</h3></div></div>
      <dl class="kv"><dt>Sign-in renewed</dt><dd>${S.xero === 'reconnect' ? '<span class="down">Rejected by Xero</span>' : '4 min ago'}</dd><dt>Auto-renews</dt><dd>Every 20 min</dd><dt>API calls today</dt><dd>312 of 5,000</dd></dl>
      <div class="prog" style="margin-top:10px"><span style="width:6.2%"></span></div>
      <p class="t-sub" style="margin:10px 0 0">Xero allows 60 calls a minute and 5,000 a day. Syncs pace themselves to stay well under.</p></section>
    <section class="card card-pad"><div class="card-h"><div><h3>Disconnect</h3><p>Stops syncing and deletes the stored Xero sign-in. Data already copied stays in Finance.</p></div></div>
      <button class="btn danger" data-act="disconnect" ${owner ? '' : 'disabled'}>${ic('unplug')}Disconnect Xero</button></section>
  </div></div>`;
  return h;
}

/* ── Render + events ──────────────────────────────────────────────────────── */
function render() {
  renderShell();
  $('#view').innerHTML = S.page === 'finance' ? renderFinance() : renderSettings();
  renderDrawer();
}
let toastT;
function toast(msg) { const t = $('#toast'); t.innerHTML = ic('ok') + esc(msg); t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function modal(open) {
  const m = $('#modal');
  m.innerHTML = open ? `<div class="card" role="alertdialog" aria-labelledby="m-t"><h3 id="m-t">Disconnect Xero?</h3><p>Syncing stops and the stored Xero sign-in is deleted. Contacts and transactions already copied stay in Finance and reports. You can reconnect any time.</p><div class="actions" style="justify-content:flex-end"><button class="btn" data-act="cancel">Keep connected</button><button class="btn danger" data-act="do-disconnect">${ic('unplug')}Disconnect</button></div></div>` : '';
  m.classList.toggle('open', open);
  $('#overlay').classList.toggle('open', open || S.stack.length > 0);
  if (open) m.querySelector('button').focus();
}
let progT;
function startFirstSync() {
  S.xero = 'syncing'; S.progress = 0; clearInterval(progT);
  progT = setInterval(() => {
    S.progress += 1;
    if (S.progress >= 16) { clearInterval(progT); S.xero = 'connected'; S.lastSync = TODAY; toast('First sync finished — ' + contacts.length + ' contacts and ' + (invoices.length + bills.length) + ' invoices & bills copied'); }
    render();
  }, 450);
}
const DEFAULT_SORT = { contacts: { key: 'owed', dir: -1 } };
function act(a, el) {
  switch (a) {
    case 'close': S.stack = []; break;
    case 'back': S.stack.pop(); break;
    case 'clear': Object.assign(S, { q: '', role_f: 'all', status: 'all', archived: false, btype: 'all', range: 'all', cur: 'all', recon: 'all', pg: 1 }); break;
    case 'toast': toast(el.dataset.msg); return;
    case 'export': toast(`Exported ${rows().length} ${S.tab === 'bank' ? 'bank transactions' : S.tab} to finance-${S.tab}-2026-09-15.xlsx`); return;
    case 'sync': S.syncing = true; render(); setTimeout(() => { S.syncing = false; S.lastSync = TODAY; render(); toast('Synced — 3 invoices and 1 contact changed since last run'); }, 1600); return;
    case 'connect': el.innerHTML = `<svg class="i spin" viewBox="0 0 24 24">${IC.refresh}</svg>Opening Xero…`; el.disabled = true; setTimeout(() => { toast('Connected to Nifty IT Solution Ltd — first sync started'); startFirstSync(); render(); }, 1300); return;
    case 'disconnect': modal(true); return;
    case 'cancel': modal(false); return;
    case 'do-disconnect': modal(false); clearInterval(progT); S.xero = 'none'; toast('Xero disconnected'); break;
  }
  render();
}
function openKpi(k) {
  const m = { recv: ['invoices', { status: 'AUTHORISED' }], overdue: ['invoices', { status: 'overdue' }], pay: ['bills', { status: 'AUTHORISED' }], in: ['payments', {}], out: ['bank', { btype: 'SPEND' }] }[k];
  Object.assign(S, { tab: m[0], q: '', status: 'all', btype: 'all', range: 'all', cur: 'all', recon: 'all', pg: 1, sort: { key: 'date', dir: -1 } }, m[1]);
  render();
  document.querySelector('.utabs').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-nav],[data-tab],[data-seg],[data-sort],[data-pg],[data-open],[data-push],[data-dtab],[data-act],[data-kpi]');
  if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.nav) { e.preventDefault(); if (t.classList.contains('dim')) return; S.page = d.nav; S.stack = []; render(); window.scrollTo(0, 0); return; }
  if (d.tab) { Object.assign(S, { tab: d.tab, q: '', status: 'all', range: 'all', cur: 'all', recon: 'all', btype: 'all', role_f: 'all', pg: 1, sort: DEFAULT_SORT[d.tab] || { key: 'date', dir: -1 } }); return render(); }
  if (d.seg) { S[d.seg] = d.v; S.pg = 1; return render(); }
  if (d.sort) { S.sort = S.sort.key === d.sort ? { key: d.sort, dir: -S.sort.dir } : { key: d.sort, dir: -1 }; return render(); }
  if (d.pg) { S.pg += Number(d.pg); return render(); }
  if (d.open) { S.stack = [{ kind: d.open, id: d.id }]; S.dtab = 'invoices'; return renderDrawer(); }
  if (d.push) { e.preventDefault(); if (d.push === 'contact') S.dtab = 'invoices'; S.stack.push({ kind: d.push, id: d.id }); return renderDrawer(); }
  if (d.dtab) { S.dtab = d.dtab; return renderDrawer(); }
  if (d.kpi) return openKpi(d.kpi);
  if (d.act) act(d.act, t);
});
document.addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f) return;
  S[f] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; S.pg = 1;
  const pos = e.target.selectionStart; render();
  const again = document.getElementById(e.target.id); if (again) again.focus();
  if (f === 'q') { try { again.setSelectionRange(pos, pos); } catch (_) {} }
});
document.addEventListener('change', e => {
  const p = e.target.dataset.proto; if (!p) return;
  S[p] = e.target.value; S.stack = [];
  if (p === 'xero') { clearInterval(progT); if (S.xero === 'syncing') return startFirstSync(); }
  render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal').classList.contains('open')) modal(false); else if (S.stack.length) { S.stack = []; renderDrawer(); } }
  if (e.key === 'Enter' && e.target.matches('tr[data-open]')) e.target.click();
});
$('#overlay').addEventListener('click', () => { if ($('#modal').classList.contains('open')) return modal(false); S.stack = []; renderDrawer(); });
render();
</script>
