<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ClickUp Sync Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    color-scheme: light;
    --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;

    /* Light theme */
    --page-bg: #f7f7f5;
    --surface: #ffffff;
    --surface-alt: #fafaf9;
    --muted-bg: #f5f5f4;
    --hover: rgba(15, 23, 42, 0.04);
    --sidebar-bg: #fafaf8;
    --sidebar-active-bg: rgba(123, 104, 238, 0.10);
    --border: #e7e5e2;
    --border-soft: #efeeec;
    --border-strong: #d4d4d2;

    --text: #0f172a;
    --text-muted: #64748b;
    --text-faint: #94a3b8;

    --accent: #7B68EE;
    --accent-hover: #6953dc;
    --accent-soft: rgba(123, 104, 238, 0.10);
    --accent-strong: #5b48c9;
    --accent-grad: linear-gradient(120deg, #FF02F0 0%, #7B68EE 50%, #49CCF9 100%);

    --green: #10b981;
    --amber: #f59e0b;
    --red: #ef4444;
    --blue: #3b82f6;

    --pill-green-bg: #d1fae5;
    --pill-green-text: #065f46;
    --pill-amber-bg: #fef3c7;
    --pill-amber-text: #92400e;
    --pill-red-bg: #fee2e2;
    --pill-red-text: #991b1b;
    --pill-blue-bg: #dbeafe;
    --pill-blue-text: #1e40af;
    --pill-purple-bg: #ede9fe;
    --pill-purple-text: #5b21b6;
    --pill-gray-bg: #f1f5f9;
    --pill-gray-text: #475569;
  }

  [data-theme="dark"] {
    color-scheme: dark;
    --page-bg: #0a0a0b;
    --surface: #131316;
    --surface-alt: #18181b;
    --muted-bg: #1c1c20;
    --hover: rgba(255, 255, 255, 0.04);
    --sidebar-bg: #0f0f11;
    --sidebar-active-bg: rgba(123, 104, 238, 0.15);
    --border: #27272a;
    --border-soft: #1f1f22;
    --border-strong: #3f3f46;

    --text: #fafafa;
    --text-muted: #a1a1aa;
    --text-faint: #71717a;

    --pill-green-bg: rgba(16, 185, 129, 0.15);
    --pill-green-text: #34d399;
    --pill-amber-bg: rgba(245, 158, 11, 0.15);
    --pill-amber-text: #fbbf24;
    --pill-red-bg: rgba(239, 68, 68, 0.15);
    --pill-red-text: #f87171;
    --pill-blue-bg: rgba(59, 130, 246, 0.15);
    --pill-blue-text: #60a5fa;
    --pill-purple-bg: rgba(139, 92, 246, 0.18);
    --pill-purple-text: #c4b5fd;
    --pill-gray-bg: rgba(148, 163, 184, 0.12);
    --pill-gray-text: #cbd5e1;
  }

  [data-density="compact"] { --row-h: 36px; --pad-y: 8px; }
  [data-density="comfortable"] { --row-h: 48px; --pad-y: 12px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--page-bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  code, pre { font-family: var(--font-mono); }
  button { font-family: inherit; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalIn { from { opacity: 0; transform: translateY(-8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18); }
    50% { box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.08); }
  }

  /* Native form polish */
  input, select, textarea {
    font-family: inherit;
    color: var(--text);
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid var(--page-bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

  /* Dark mode date input */
  [data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="mock-data.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="data-table.jsx"></script>
<script type="text/babel" src="charts.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="app-shell.jsx"></script>

<script type="text/babel" src="pages/overview.jsx"></script>
<script type="text/babel" src="pages/tasks.jsx"></script>
<script type="text/babel" src="pages/time-entries.jsx"></script>
<script type="text/babel" src="pages/missing-rates.jsx"></script>
<script type="text/babel" src="pages/assignee-rates.jsx"></script>
<script type="text/babel" src="pages/spaces.jsx"></script>
<script type="text/babel" src="pages/sync-logs.jsx"></script>
<script type="text/babel" src="pages/settings.jsx"></script>

<script type="text/babel" src="variations-canvas.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<window.App/>);
</script>
</body>
</html>
